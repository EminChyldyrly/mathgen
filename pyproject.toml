[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathgen"
version = "0.1.0"
description = "Генератор и проверка школьных задач по математике: точная арифметика, листки в PDF с вариантами и ключом"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["reportlab>=4"]

[project.scripts]
mathgen = "mathgen.cli:main"

[tool.setuptools]
packages = ["mathgen"]

[tool.setuptools.package-data]
mathgen = ["fonts/*"]
